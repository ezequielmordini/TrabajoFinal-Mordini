{% extends 'base.html' %}
{% block content %}
  <h1>{% if object %}Editar{% else %}Crear nuevo{% endif %} partido</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
  </form>
  <a href="{% url 'entradas:admin_partido_list' %}">Volver a la lista</a>
{% endblock %}
