{% extends 'base.html' %}
{% block content %}
  <h1>Confirmar eliminación</h1>
  <p>¿Querés eliminar el partido "{{ object }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'entradas:admin_partido_list' %}">Cancelar</a>
  </form>
{% endblock %}
